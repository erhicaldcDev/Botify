<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botify</title>
  <meta name="description" content="Build Discord bots with no programming skills" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/discord.css" />
</head>

<body class="theme-dark">
  <div id="app">
    <div id="titlebar">
      <div class="titlebar-drag">
        <div class="titlebar-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" fill="var(--accent)" />
          </svg>
          <span>Botify</span>
          <span class="titlebar-project" id="titlebar-project"></span>
        </div>
      </div>
      <div class="titlebar-actions">
        <span class="status-dot stopped" id="titlebar-status"></span>
        <button class="titlebar-run" id="titlebar-run" title="Build & run the bot (Ctrl+Enter)" disabled>Run bot</button>
      </div>
      <div class="titlebar-controls">
        <button id="btn-minimize" class="titlebar-btn" aria-label="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor" /></svg>
        </button>
        <button id="btn-maximize" class="titlebar-btn" aria-label="Maximize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none" /></svg>
        </button>
        <button id="btn-close" class="titlebar-btn titlebar-btn-close" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
      </div>
    </div>

    <div id="main-layout">
      <nav id="sidebar">
        <div class="sidebar-section sidebar-project" title="Current project">
          <div class="sidebar-label" data-i18n="PROJECT">PROJECT</div>
          <div id="project-name-display" class="sidebar-project-name">No Project</div>
        </div>
        <div class="sidebar-nav">
          <button class="nav-item active" data-page="dashboard" title="Dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>
            <span data-i18n="Dashboard">Dashboard</span>
          </button>

          <div class="nav-group" data-i18n="BUILD">BUILD</div>
          <button class="nav-item" data-page="commands" title="Commands">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" /></svg>
            <span data-i18n="Commands">Commands</span><span class="nav-count"></span>
          </button>
          <button class="nav-item" data-page="events" title="Events">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" /></svg>
            <span data-i18n="Events">Events</span><span class="nav-count"></span>
          </button>
          <button class="nav-item" data-page="embeds" title="Embeds">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="7" y1="3" x2="7" y2="21" /><line x1="11" y1="8" x2="17" y2="8" /><line x1="11" y1="12" x2="17" y2="12" /></svg>
            <span data-i18n="Embed Styler">Embed Styler</span><span class="nav-count"></span>
          </button>
          <button class="nav-item" data-page="layouts" title="Components V2 layouts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="7" rx="2" /><rect x="3" y="14" width="8" height="7" rx="2" /><rect x="15" y="14" width="6" height="7" rx="2" /></svg>
            <span data-i18n="Layouts (V2)">Layouts (V2)</span><span class="nav-count"></span>
          </button>
          <button class="nav-item" data-page="help" title="Help menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>
            <span data-i18n="Help Menu">Help Menu</span>
          </button>

          <div class="nav-group" data-i18n="DEVELOP">DEVELOP</div>
          <button class="nav-item" data-page="console" title="Console">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2" /><path d="M6 9l4 3-4 3" /><line x1="12" y1="15" x2="18" y2="15" /></svg>
            <span data-i18n="Console">Console</span><span class="nav-count nav-count-error" id="nav-error-count"></span>
          </button>
          <button class="nav-item" data-page="ide" title="Code IDE">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6" /><polyline points="8 6 2 12 8 18" /></svg>
            <span data-i18n="Code IDE">Code IDE</span>
          </button>
          <button class="nav-item" data-page="database" title="Database">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></svg>
            <span data-i18n="Database">Database</span>
          </button>

          <div class="nav-group" data-i18n="CONFIGURE">CONFIGURE</div>
          <button class="nav-item" data-page="plugins" title="Plugins">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v6m0 8v6M2 12h6m8 0h6" /><circle cx="12" cy="12" r="3" /></svg>
            <span data-i18n="Plugins">Plugins</span>
          </button>
          <button class="nav-item" data-page="settings" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
            <span data-i18n="Settings">Settings</span>
          </button>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-socials">
            <button class="social-btn" id="sidebar-collapse" title="Collapse / expand sidebar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="9" y1="3" x2="9" y2="21" /></svg>
            </button>
            <button class="social-btn" title="GitHub" data-link="https://github.com/erhicaldcDev/Botify">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.7 1.7.2 2.9.1 3.2.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z" /></svg>
            </button>
            <button class="social-btn" title="Discord Developer Portal" data-link="https://discord.com/developers/applications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>
            </button>
          </div>
          <div class="engine-badge" id="engine-badge">
            <span class="engine-dot"></span>
            <span id="engine-label">No Engine</span>
          </div>
        </div>
      </nav>

      <main id="content">
        <div id="page-dashboard" class="page active"></div>
        <div id="page-commands" class="page"></div>
        <div id="page-events" class="page"></div>
        <div id="page-embeds" class="page"></div>
        <div id="page-layouts" class="page"></div>
        <div id="page-help" class="page"></div>
        <div id="page-console" class="page"></div>
        <div id="page-ide" class="page page-full"></div>
        <div id="page-database" class="page"></div>
        <div id="page-plugins" class="page"></div>
        <div id="page-settings" class="page"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script>
    window.pages = {};
    const AppState = {
      currentProject: null,
      projects: [],
      currentPage: "dashboard",
      bot: { running: false, online: false, installing: false, engine: null },
    };
    window.AppState = AppState;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <script src="shared/blocks.js"></script>
  <script src="shared/layout.js"></script>
  <script src="renderer/core/utils.js"></script>
  <script src="renderer/components/discord-preview.js"></script>
  <script src="renderer/components/field-form.js"></script>
  <script src="renderer/components/embed-editor.js"></script>
  <script src="renderer/components/layout-editor.js"></script>
  <script src="renderer/components/bvs-editor.js"></script>

  <script src="renderer/pages/dashboard.js"></script>
  <script src="renderer/pages/commands.js"></script>
  <script src="renderer/pages/events.js"></script>
  <script src="renderer/pages/embeds.js"></script>
  <script src="renderer/pages/layouts.js"></script>
  <script src="renderer/pages/help.js"></script>
  <script src="renderer/pages/console.js"></script>
  <script src="renderer/pages/ide.js"></script>
  <script src="renderer/pages/database.js"></script>
  <script src="renderer/pages/plugins.js"></script>
  <script src="renderer/pages/settings.js"></script>
  <script src="renderer/app.js"></script>
</body>

</html>
